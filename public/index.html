<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrishop — Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--bg2:#111921;--surface:#16202b;--surface2:#1c2a38;--border:#1e2d3d;--border2:#2a3d52;
  --ink:#fff;--ink2:#a0b4c8;--ink3:#5d7385;
  --blue:#0075CF;--blue-dim:rgba(0,117,207,.14);--blue-bright:#2a9af0;
  --green:#34c97a;--amber:#f0b84a;--red:#f05a4a;
  --col-franklin:#2a9af0;--col-gulch:#34c97a;--col-henderson:#f0b84a;
  --head:'Barlow Condensed',sans-serif;--body:'Barlow',sans-serif;--mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}

/* header */
.header{background:var(--bg2);border-bottom:2px solid var(--blue);padding:10px 24px;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:34px;width:auto}
.brand-div{width:1px;height:26px;background:var(--border2)}
.brand-sub{font-family:var(--head);font-size:18px;letter-spacing:4px;color:var(--ink2);font-weight:700}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);font-family:var(--mono);font-size:11px;color:var(--ink3)}
.pill.live{border-color:var(--blue);color:var(--blue-bright)}
.pill.loading{border-color:var(--amber);color:var(--amber)}
.pill.error{border-color:var(--red);color:var(--red)}
.pdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.loading .pdot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.btn{padding:8px 16px;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid transparent;letter-spacing:.4px;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:not(:disabled):hover{background:var(--blue-bright)}
.btn-green{background:var(--green);color:#06210f}
.btn-ghost{background:none;border-color:var(--border2);color:var(--ink2)}
.btn-ghost:not(:disabled):hover{border-color:var(--blue);color:var(--blue-bright)}
.btn-sm{padding:5px 10px;font-size:12px}

/* totals */
.totals{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;gap:28px;flex-wrap:wrap}
.tcard{display:flex;flex-direction:column;gap:2px}
.tlabel{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--ink3)}
.tval{font-family:var(--head);font-size:28px;letter-spacing:1px;font-weight:700}
.tval.green{color:var(--green)}.tval.amber{color:var(--amber)}.tval.red{color:var(--red)}
button.tcard{background:none;border:none;text-align:left;cursor:pointer}
button.tcard:hover .tlabel{color:var(--ink2)}

/* filters */
.filters{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:64px;z-index:40}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:8px 12px 8px 32px;font-size:14px;outline:none}
.search input:focus{border-color:var(--blue)}
.search span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.seg{display:flex;border:1px solid var(--border2);border-radius:6px;overflow:hidden}
.seg button{background:none;border:none;padding:7px 12px;font-family:var(--head);font-weight:700;font-size:14px;letter-spacing:1px;color:var(--ink3);cursor:pointer;border-right:1px solid var(--border2)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed=true]{background:var(--blue-dim);color:var(--ink)}
.seg button[data-loc=franklin][aria-pressed=true]{color:var(--col-franklin)}
.seg button[data-loc=gulch][aria-pressed=true]{color:var(--col-gulch)}
.seg button[data-loc=henderson][aria-pressed=true]{color:var(--col-henderson)}
.select{background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--ink2);outline:none}
.select:focus{border-color:var(--blue)}
.count{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:auto}

/* categories + tables */
.main{padding:16px 24px 60px}
.cat{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 400px}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;cursor:pointer;user-select:none;width:100%;background:none;border:none;text-align:left}
.cat-head:hover{background:var(--surface2)}
.cat-left{display:flex;align-items:center;gap:10px}
.chev{font-size:10px;color:var(--ink3);transition:transform .15s}
.cat:not(.closed) .chev{transform:rotate(90deg)}
.cat-name{font-family:var(--head);font-size:19px;font-weight:700;letter-spacing:1.5px}
.cat-n{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.cat-tot{display:flex;gap:20px;font-family:var(--mono);font-size:12px}
.cat-tot b{display:block;font-size:9px;letter-spacing:1.5px;color:var(--ink3);font-weight:400}
.cat.closed .tw{display:none}
.tw{overflow-x:auto;border-top:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--ink3);font-weight:500;text-align:right;padding:8px 12px;background:var(--bg2);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:7px 12px;border-top:1px solid var(--border);text-align:right;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
td:first-child{font-family:var(--body);font-size:14px;white-space:normal;min-width:220px}
tbody tr:hover td{background:rgba(255,255,255,.025)}
tfoot td{font-weight:600;background:var(--bg2);color:var(--ink2)}
.sku{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:1px}
.th-franklin{color:var(--col-franklin)!important}.th-gulch{color:var(--col-gulch)!important}.th-henderson{color:var(--col-henderson)!important}
.nc{color:var(--border2)}
.q0{color:var(--red)}.qlow{color:var(--amber)}
.g{color:var(--green)}.a{color:var(--amber)}.m{color:var(--ink2)}
.vary{color:var(--amber);cursor:help}
.edit{background:none;border:1px solid var(--border2);color:var(--ink2);border-radius:4px;padding:3px 8px;font-family:var(--mono);font-size:10.5px;cursor:pointer;margin-left:8px;vertical-align:1px}
.edit:hover{border-color:var(--blue);color:var(--blue-bright)}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;padding:1px 6px;border-radius:3px;border:1px solid var(--border2);color:var(--ink3);margin-left:6px;vertical-align:1px}

/* states */
.center{padding:80px 24px;text-align:center;color:var(--ink2)}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--ink3);margin-top:8px}

/* login */
.login{max-width:360px;margin:12vh auto;padding:32px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.login h1{font-family:var(--head);font-size:26px;letter-spacing:2px;margin-bottom:6px}
.login p{color:var(--ink2);font-size:14px;margin-bottom:20px}
.login input{width:100%;margin-bottom:12px}
.login .btn{width:100%;padding:10px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:5vh 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;width:100%;max-width:680px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border)}
.mtitle{font-family:var(--head);font-size:22px;letter-spacing:1px;font-weight:700}
.msub{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:3px}
.x{background:none;border:none;color:var(--ink3);font-size:20px;cursor:pointer;line-height:1}
.x:hover{color:var(--ink)}
.mbody{padding:18px 22px;display:flex;flex-direction:column;gap:18px}
.sect-t{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--ink3);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--ink2)}
.field.full{grid-column:1/-1}
.inp{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:8px 10px;font-size:14px;outline:none;width:100%;font-family:var(--mono)}
.inp.text{font-family:var(--body)}
.inp:focus{border-color:var(--blue)}
.inp:disabled{opacity:.35}
.inp.bad{border-color:var(--red)}
.inp.changed{border-color:var(--amber)}
.stores{width:100%;border-collapse:collapse}
.stores th{background:none;padding:4px 6px;text-align:left}
.stores td{border:none;padding:4px 6px;font-family:var(--body);font-size:14px;text-align:left;min-width:0}
.stores td:first-child{min-width:150px}
.stores .inp{min-width:70px}
.sname{display:flex;align-items:center;gap:8px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.franklin{background:var(--col-franklin)}.dot.gulch{background:var(--col-gulch)}.dot.henderson{background:var(--col-henderson)}
.note{font-size:12px;color:var(--ink3)}
.quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mfoot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--border);flex-wrap:wrap}
.status{margin-right:auto;font-size:13px;color:var(--ink2);max-width:100%}
.status.ok{color:var(--green)}.status.bad{color:var(--red)}.status.warn{color:var(--amber)}
input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px}

.toast{position:fixed;bottom:22px;right:22px;left:auto;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:12px 16px;font-size:14px;z-index:300;max-width:min(420px,calc(100vw - 32px));box-shadow:0 8px 28px rgba(0,0,0,.4);transition:opacity .2s,transform .2s;opacity:0;transform:translateY(8px);pointer-events:none}
.toast.show{opacity:1;transform:none}

@media (max-width:700px){
  .header,.totals,.filters,.main{padding-left:16px;padding-right:16px}
  .filters{position:static}
  .brand img{height:28px}
  .tval{font-size:22px}
  .totals{gap:16px}
  .cat-tot{gap:12px}
  .grid2{grid-template-columns:1fr}
  .count{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<header class="header">
  <div class="brand">
    <img src="https://cdn.shopify.com/s/files/1/0685/2647/3535/files/NSP_Logo_Updated_10.24.png?v=1730203346" alt="Nutrishop">
    <div class="brand-div"></div>
    <div class="brand-sub">INVENTORY</div>
  </div>
  <div class="hdr-right" id="hdrRight" hidden>
    <div class="pill" id="pill"><div class="pdot"></div><span id="pillTxt">Not synced</span></div>
    <button class="btn btn-ghost" id="csvBtn">↓ CSV</button>
    <button class="btn btn-green" id="newBtn">+ New product</button>
    <button class="btn btn-primary" id="syncBtn">↺ Sync</button>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" title="Sign out">Sign out</button>
  </div>
</header>

<!-- Login -->
<form class="login" id="loginView" hidden>
  <h1>SIGN IN</h1>
  <p>Enter the inventory password.</p>
  <input class="inp text" id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
  <div class="err" id="loginErr"></div>
  <button class="btn btn-primary" id="loginBtn" type="submit">Sign in</button>
</form>

<!-- App -->
<div id="appView" hidden>
  <section class="totals" id="totals" hidden>
    <div class="tcard"><div class="tlabel">PRODUCTS</div><div class="tval" id="tItems">—</div></div>
    <div class="tcard"><div class="tlabel">UNITS</div><div class="tval" id="tQty">—</div></div>
    <div class="tcard"><div class="tlabel">RETAIL VALUE</div><div class="tval green" id="tRetail">—</div></div>
    <div class="tcard"><div class="tlabel">COST VALUE</div><div class="tval amber" id="tCost">—</div></div>
    <div class="tcard"><div class="tlabel">GROSS MARGIN</div><div class="tval green" id="tMargin">—</div></div>
    <button class="tcard" data-stock="low" title="Show low stock"><div class="tlabel">LOW STOCK</div><div class="tval amber" id="tLow">—</div></button>
    <button class="tcard" data-stock="out" title="Show out of stock"><div class="tlabel">OUT OF STOCK</div><div class="tval red" id="tOut">—</div></button>
  </section>

  <section class="filters" id="filters" hidden>
    <label class="search"><span>⌕</span><input id="q" type="search" placeholder="Search name, SKU, UPC…  ( / )" autocomplete="off"></label>
    <div class="seg" id="locSeg" role="group" aria-label="Store"></div>
    <select class="select" id="catSel" aria-label="Category"><option value="">All categories</option></select>
    <select class="select" id="stockSel" aria-label="Stock">
      <option value="all">All stock</option>
      <option value="in">In stock only</option>
      <option value="low">Low stock</option>
      <option value="out">Out of stock</option>
      <option value="missing">Missing from a store</option>
    </select>
    <label class="note" style="display:flex;align-items:center;gap:6px">Low ≤ <input class="inp" id="lowIn" type="number" min="0" step="1" value="3" style="width:60px;padding:5px 8px"></label>
    <button class="btn btn-ghost btn-sm" id="collapseBtn">Collapse all</button>
    <span class="count" id="count"></span>
  </section>

  <main class="main" id="main"></main>
</div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
/* ── Config ─────────────────────────────────────────────
   When hosted on Firebase, the API lives on Render.
   When served by the Render server itself (/app), same origin. */
const API = /\.(web\.app|firebaseapp\.com)$/.test(location.hostname)
  ? 'https://clover-proxy-hs3q.onrender.com/api'
  : '/api';

/* ── Utilities ── */
const $ = id => document.getElementById(id);
const ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);
const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const usd = new Intl.NumberFormat('en-US', {style:'currency', currency:'USD'});
const money = c => usd.format((c || 0) / 100);
const num = n => n.toLocaleString('en-US');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
function toast(msg, ms = 3500) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms);
}
function setPill(kind, text) { $('pill').className = 'pill ' + kind; $('pillTxt').textContent = text; }

/* ── State ── */
const S = {
  stores: [], products: [], categories: [], syncedAt: null,
  q: '', loc: ls.get('inv.loc') || 'all', cat: '', stock: ls.get('inv.stock') || 'all', low: Number(ls.get('inv.low')) || 3,
  collapsed: new Set(JSON.parse(ls.get('inv.collapsed') || '[]')),
};
const storeName = id => S.stores.find(s => s.id === id)?.name || id;

/* ── Auth + API ── */
const auth = {
  token() {
    const exp = Number(ls.get('inv.exp'));
    return exp > Date.now() ? ls.get('inv.token') : null;
  },
  save(t, exp) { ls.set('inv.token', t); ls.set('inv.exp', String(exp)); },
  clear() { ls.del('inv.token'); ls.del('inv.exp'); },
};
class SignedOut extends Error {}
async function api(path, { method = 'GET', body } = {}) {
  const tok = auth.token();
  let res;
  try {
    res = await fetch(API + path, {
      method,
      headers: { ...(tok ? { Authorization: 'Bearer ' + tok } : {}), ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch { throw new Error('Can’t reach the server. Check your connection and try again.'); }
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && path !== '/login') { auth.clear(); showLogin(data.error); throw new SignedOut(); }
  if (!res.ok) throw new Error(data.error || `Server error (${res.status})`);
  return data;
}

function showLogin(msg) {
  closeModal();
  $('appView').hidden = true; $('hdrRight').hidden = true; $('loginView').hidden = false;
  $('loginErr').textContent = msg || '';
  $('pw').value = ''; $('pw').focus();
}
$('loginView').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
  $('loginErr').textContent = '';
  const slow = setTimeout(() => { btn.textContent = 'Waking server (up to a minute)…'; }, 4000);
  try {
    const r = await api('/login', { method: 'POST', body: { password: $('pw').value } });
    auth.save(r.token, r.expiresAt);
    startApp();
  } catch (err) { $('loginErr').textContent = err.message; }
  clearTimeout(slow); btn.disabled = false; btn.textContent = 'Sign in';
});
$('logoutBtn').onclick = () => { auth.clear(); S.products = []; showLogin(); };

/* ── Data ── */
function indexProduct(p) {
  p._hay = norm([p.name, p.category, ...Object.values(p.stores).flatMap(i => [i.sku, i.code])].join(' '));
}
async function sync(fresh) {
  const btn = $('syncBtn'); btn.disabled = true; btn.textContent = '⏳ Syncing';
  setPill('loading', 'Syncing…');
  if (!S.products.length) $('main').innerHTML = `<div class="center"><div class="spinner"></div><div id="loadMsg">Loading inventory from Clover…</div></div>`;
  const slow = setTimeout(() => { const m = $('loadMsg'); if (m) m.innerHTML = 'Waking the server…<div class="hint">The first load after a quiet period can take up to a minute.</div>'; }, 5000);
  try {
    const d = await api('/inventory' + (fresh ? '?fresh=1' : ''));
    S.stores = d.stores; S.categories = d.categories; S.syncedAt = new Date(d.syncedAt);
    S.products = d.products; S.products.forEach(indexProduct);
    if (S.loc !== 'all' && !S.stores.some(s => s.id === S.loc)) S.loc = 'all';
    buildFilters();
    render();
    $('totals').hidden = false; $('filters').hidden = false;
    if (d.errors.length) {
      setPill('error', 'Partial sync');
      toast('⚠ ' + d.errors.map(e => `${storeName(e.store)}: ${e.message}`).join(' · '), 8000);
    } else {
      setPill('live', 'Synced ' + S.syncedAt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
    }
  } catch (err) {
    if (!(err instanceof SignedOut)) {
      setPill('error', 'Error');
      if (!S.products.length) $('main').innerHTML = `<div class="center">❌ ${esc(err.message)}<div class="hint"><button class="btn btn-ghost" onclick="sync(true)">Try again</button></div></div>`;
      else toast('❌ ' + err.message, 6000);
    }
  }
  clearTimeout(slow);
  btn.disabled = false; btn.textContent = '↺ Sync';
}

/* ── Filters ── */
function buildFilters() {
  $('locSeg').innerHTML = [{ id: 'all', name: 'All' }, ...S.stores].map(s =>
    `<button data-loc="${s.id}" aria-pressed="${S.loc === s.id}">${esc(s.name.toUpperCase())}</button>`).join('');
  const cats = [...new Set(S.products.map(p => p.category))].sort();
  $('catSel').innerHTML = '<option value="">All categories</option>' + cats.map(c => `<option${c === S.cat ? ' selected' : ''}>${esc(c)}</option>`).join('');
  $('lowIn').value = S.low;
  $('stockSel').value = S.stock;
  $('stockSel').querySelector('[value=missing]').hidden = S.loc !== 'all';
}
$('locSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-loc]'); if (!b) return;
  S.loc = b.dataset.loc; ls.set('inv.loc', S.loc);
  if (S.loc !== 'all' && S.stock === 'missing') { S.stock = 'all'; $('stockSel').value = 'all'; }
  buildFilters(); render();
});

/* ── View math ── */
function viewStores() { return S.loc === 'all' ? S.stores.map(s => s.id) : [S.loc]; }
function stats(p, ids) {
  let qty = 0, retail = 0, cost = 0, carried = 0, low = false, out = false, pmin = Infinity, pmax = -Infinity, cmin = Infinity, cmax = -Infinity;
  for (const id of ids) {
    const it = p.stores[id]; if (!it) continue;
    carried++;
    const q = it.qty ?? 0, pos = Math.max(q, 0);
    qty += q; retail += pos * it.price; cost += pos * it.cost;
    if (q <= 0) out = true; else if (q <= S.low) low = true;
    pmin = Math.min(pmin, it.price); pmax = Math.max(pmax, it.price);
    cmin = Math.min(cmin, it.cost); cmax = Math.max(cmax, it.cost);
  }
  return { qty, retail, cost, carried, low, out, pmin, pmax, cmin, cmax };
}
function filtered() {
  const ids = viewStores();
  const terms = norm(S.q).split(' ').filter(Boolean);
  const out = [];
  for (const p of S.products) {
    const st = stats(p, ids);
    if (!st.carried) continue;
    if (S.cat && p.category !== S.cat) continue;
    if (terms.length && !terms.every(t => p._hay.includes(t))) continue;
    if (S.stock === 'in' && st.qty <= 0) continue;
    if (S.stock === 'low' && !st.low) continue;
    if (S.stock === 'out' && !st.out) continue;
    if (S.stock === 'missing' && st.carried === S.stores.length) continue;
    out.push({ p, st });
  }
  return out;
}

/* ── Render ── */
function priceCell(min, max) {

}
function qtyCell(q) {

  const cls = q <= 0 ? 'q0' : q <= S.low ? 'qlow' : '';

}
function render() {

async function saveEdit() {
  const p = editing, m = $('modal');
  const changes = [], adds = {};
  let bad = false;
  for (const s of S.stores) {
    const tr = m.querySelector(`tr[data-store="${s.id}"]`);
    const it = p.stores[s.id];
    const add = tr.querySelector('[name=add]');

    if (!price.ok || !cost.ok || !qty.ok) { bad = true; continue; }
    if (it) {
      const c = { store: s.id, itemId: it.id };
      if (centsOf(price.value) !== it.price) c.price = price.value;
      if (centsOf(cost.value) !== it.cost) c.cost = cost.value;
      if (qty.value !== it.qty) c.qty = qty.value;

  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Saving…'; modalBusy = true;

      Object.keys(adds).length ? api('/items/create', { method: 'POST', body: {
        name: p.name, sku: Object.values(p.stores)[0]?.sku || '', code: Object.values(p.stores)[0]?.code || '',
        category: p.category === 'Uncategorized' ? '' : p.category, stores: adds } }) : { results: [] },
    ]);
    for (const r of upd.results) {
      const it = p.stores[r.store];
      if (it && r.itemId === it.id) Object.assign(it, r.saved);
      const partly = Object.keys(r.saved || {});
      if (r.ok) saved.push(storeName(r.store));

        if (partly.length) saved.push(`${storeName(r.store)} (${partly.join(', ')})`);
        errors.push(`${storeName(r.store)}: ${r.errors.join('; ')}`);
      }
    }
    for (const r of crt.results) {
      if (r.ok) { p.stores[r.store] = r.item; saved.push(storeName(r.store) + ' (added)'); }
      if (r.errors?.length) errors.push(`${storeName(r.store)}: ${r.errors.join('; ')}`);
    }

    errors.push(err.message);

    setStatus((saved.length ? `Saved: ${saved.join(', ')}. ` : '') + 'Problems — ' + errors.join(' · '), saved.length ? 'warn' : 'bad');

  }
}

function exportCSV() {

    const first = Object.values(p.stores)[0] || {};
    lines.push([p.category, p.name, first.sku, first.code,
      ...S.stores.flatMap(s => { const it = p.stores[s.id]; return it ? [d(it.price), d(it.cost), it.qty ?? 0] : ['', '', '']; }),
      st.qty, d(st.retail), d(st.cost)].map(csvCell).join(','));
  }
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `nutrishop-inventory-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`✅ Exported ${rows.length} products`);
}

$('csvBtn').onclick = exportCSV;
$('newBtn').onclick = openNew;
$('syncBtn').onclick = () => sync(true);

/* ── Boot ── */
function startApp() {
  $('loginView').hidden = true; $('appView').hidden = false; $('hdrRight').hidden = false;
  sync(false);
}
fetch(API + '/health').catch(() => {}); // start waking Render right away
auth.token() ? startApp() : showLogin();
</script>
