<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutrishop — Inventory</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111921">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NS Inventory">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--bg2:#111921;--surface:#16202b;--surface2:#1c2a38;--border:#1e2d3d;--border2:#2a3d52;
  --ink:#fff;--ink2:#a0b4c8;--ink3:#5d7385;
  --blue:#0075CF;--blue-dim:rgba(0,117,207,.14);--blue-bright:#2a9af0;
  --green:#34c97a;--amber:#f0b84a;--red:#f05a4a;
  --col-franklin:#2a9af0;--col-gulch:#34c97a;--col-henderson:#f0b84a;
  --head:'Barlow Condensed',sans-serif;--body:'Barlow',sans-serif;--mono:'DM Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);min-height:100vh}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}

/* header */
.header{background:var(--bg2);border-bottom:2px solid var(--blue);padding:10px 24px;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:34px;width:auto}
.brand-div{width:1px;height:26px;background:var(--border2)}
.brand-sub{font-family:var(--head);font-size:18px;letter-spacing:4px;color:var(--ink2);font-weight:700}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);font-family:var(--mono);font-size:11px;color:var(--ink3)}
.pill.live{border-color:var(--blue);color:var(--blue-bright)}
.pill.loading{border-color:var(--amber);color:var(--amber)}
.pill.error{border-color:var(--red);color:var(--red)}
.pdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.loading .pdot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.btn{padding:8px 16px;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;border:1px solid transparent;letter-spacing:.4px;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:not(:disabled):hover{background:var(--blue-bright)}
.btn-green{background:var(--green);color:#06210f}
.btn-ghost{background:none;border-color:var(--border2);color:var(--ink2)}
.btn-ghost:not(:disabled):hover{border-color:var(--blue);color:var(--blue-bright)}
.btn-sm{padding:5px 10px;font-size:12px}

/* totals */
.totals{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;gap:28px;flex-wrap:wrap}
.tcard{display:flex;flex-direction:column;gap:2px}
.tlabel{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--ink3)}
.tval{font-family:var(--head);font-size:28px;letter-spacing:1px;font-weight:700}
.tval.green{color:var(--green)}.tval.amber{color:var(--amber)}.tval.red{color:var(--red)}
button.tcard{background:none;border:none;text-align:left;cursor:pointer}
button.tcard:hover .tlabel{color:var(--ink2)}

/* filters */
.filters{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:64px;z-index:40}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:8px 12px 8px 32px;font-size:14px;outline:none}
.search input:focus{border-color:var(--blue)}
.search span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.seg{display:flex;border:1px solid var(--border2);border-radius:6px;overflow:hidden}
.seg button{background:none;border:none;padding:7px 12px;font-family:var(--head);font-weight:700;font-size:14px;letter-spacing:1px;color:var(--ink3);cursor:pointer;border-right:1px solid var(--border2)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed=true]{background:var(--blue-dim);color:var(--ink)}
.seg button[data-loc=franklin][aria-pressed=true]{color:var(--col-franklin)}
.seg button[data-loc=gulch][aria-pressed=true]{color:var(--col-gulch)}
.seg button[data-loc=henderson][aria-pressed=true]{color:var(--col-henderson)}
.select{background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--ink2);outline:none}
.select:focus{border-color:var(--blue)}
.count{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:auto}

/* categories + tables */
.main{padding:16px 24px 60px}
.cat{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 400px}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;cursor:pointer;user-select:none;width:100%;background:none;border:none;text-align:left}
.cat-head:hover{background:var(--surface2)}
.cat-left{display:flex;align-items:center;gap:10px}
.chev{font-size:10px;color:var(--ink3);transition:transform .15s}
.cat:not(.closed) .chev{transform:rotate(90deg)}
.cat-name{font-family:var(--head);font-size:19px;font-weight:700;letter-spacing:1.5px}
.cat-n{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.cat-tot{display:flex;gap:20px;font-family:var(--mono);font-size:12px}
.cat-tot b{display:block;font-size:9px;letter-spacing:1.5px;color:var(--ink3);font-weight:400}
.cat.closed .tw{display:none}
.tw{overflow-x:auto;border-top:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--ink3);font-weight:500;text-align:right;padding:8px 12px;background:var(--bg2);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:7px 12px;border-top:1px solid var(--border);text-align:right;white-space:nowrap;font-family:var(--mono);font-size:12.5px}
td:first-child{font-family:var(--body);font-size:14px;white-space:normal;min-width:220px}
tbody tr:hover td{background:rgba(255,255,255,.025)}
tfoot td{font-weight:600;background:var(--bg2);color:var(--ink2)}
.sku{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:1px}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--ink)}
th.sorted{color:var(--blue-bright)}
th .arr{display:inline-block;width:10px;font-size:9px}
.th-franklin{color:var(--col-franklin)!important}.th-gulch{color:var(--col-gulch)!important}.th-henderson{color:var(--col-henderson)!important}
.nc{color:var(--border2)}
.q0{color:var(--red)}.qlow{color:var(--amber)}
.g{color:var(--green)}.a{color:var(--amber)}.m{color:var(--ink2)}
.vary{color:var(--amber);cursor:help}
.edit{background:none;border:1px solid var(--border2);color:var(--ink2);border-radius:4px;padding:3px 8px;font-family:var(--mono);font-size:10.5px;cursor:pointer;margin-left:8px;vertical-align:1px}
.edit:hover{border-color:var(--blue);color:var(--blue-bright)}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;padding:1px 6px;border-radius:3px;border:1px solid var(--border2);color:var(--ink3);margin-left:6px;vertical-align:1px}

/* nav + pages */
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:1px solid transparent;border-radius:6px;padding:7px 14px;font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:1.5px;color:var(--ink3);cursor:pointer;text-transform:uppercase}
.tabs button:hover{color:var(--ink2)}
.tabs button[aria-current=page]{color:var(--ink);background:var(--blue-dim);border-color:var(--blue)}
.who{font-size:13px;color:var(--ink2)}
.page{padding:20px 24px 80px;max-width:1100px;margin:0 auto}
.page h2{font-family:var(--head);font-size:26px;letter-spacing:1.5px;margin-bottom:4px}
.page .lead{color:var(--ink2);font-size:14px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:var(--head);font-size:22px;letter-spacing:1.5px;display:flex;align-items:center;gap:8px}
.card .meta{font-size:13px;color:var(--ink2);min-height:36px}
.card .btn{align-self:flex-start}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:1px;padding:2px 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.b-open{color:var(--amber)}.b-submitted{color:var(--green)}.b-discarded{color:var(--ink3)}.b-submitting{color:var(--blue-bright)}.b-failed{color:var(--red)}
.stats{display:flex;gap:22px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.pos{color:var(--green)}.neg{color:var(--red)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px}
.list table td{white-space:nowrap}
.list table td:first-child{white-space:normal;min-width:160px}
tr.click{cursor:pointer}
.bar{height:8px;background:var(--border2);border-radius:4px;overflow:hidden;margin:12px 0}
.bar > div{height:100%;background:var(--blue);transition:width .3s}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

/* count sheet */
.ctool{position:sticky;top:64px;z-index:30;background:var(--bg);padding:10px 0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border);margin-bottom:12px}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctitle{font-family:var(--head);font-size:22px;letter-spacing:1.5px;font-weight:700}
.saved{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.saved.warn{color:var(--amber)}
.item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--border)}
.item.done{background:rgba(52,201,122,.05)}
.item .nm{flex:1;min-width:0;font-size:15px}
.item .nm small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.item.flash{animation:flash 1s}
@keyframes flash{0%{background:rgba(0,117,207,.35)}100%{background:transparent}}
.stepper{display:flex;align-items:center;gap:4px;flex-shrink:0}
.stepper button{width:38px;height:40px;border-radius:6px;border:1px solid var(--border2);background:var(--bg2);font-size:18px;cursor:pointer;color:var(--ink2)}
.stepper button:active{background:var(--blue-dim)}
.stepper input{width:72px;height:40px;text-align:center;font-size:17px}
.item.done .stepper input{border-color:var(--green)}
.cat .cnt{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.cat .cnt.full{color:var(--green)}
.chip{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
@media (max-width:700px){
  .page{padding:14px 12px 80px}
  .ctool{top:0}
  .tabs button{padding:6px 9px;font-size:14px}
  .item{padding:9px 10px}
  .stepper button{width:34px}
  .stepper input{width:60px}
}

/* label picker */
.lbls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border2);border-radius:14px;padding:4px 10px;font-size:12.5px;cursor:pointer;user-select:none;color:var(--ink2)}
.lbl input{width:14px;height:14px}
.lbl:has(input:checked){border-color:var(--blue);color:var(--ink);background:var(--blue-dim)}
.field.changed .inp,.lbls.changed{outline:1px solid var(--amber);outline-offset:2px;border-radius:6px}
.varies{font-size:11px;color:var(--amber)}

/* camera scanner */
.scan{position:fixed;inset:0;z-index:250;background:rgba(5,8,12,.97);display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;overflow-y:auto}
.scan-top{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center}
.scan .x{font-size:28px;padding:4px 10px}
#scanReader{width:100%;max-width:520px;border-radius:12px;overflow:hidden;background:#000;min-height:240px}
#scanReader{position:relative}
#scanReader video{width:100%;height:auto;display:block}
.scan-aim{position:absolute;left:5%;right:5%;top:25%;bottom:25%;border:3px solid rgba(52,201,122,.9);border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.scan-msg{font-size:16px;text-align:center;color:var(--ink2);min-height:24px;max-width:520px}
.scan-msg.ok{color:var(--green);font-weight:600}.scan-msg.bad{color:var(--amber)}
.scan-manual{width:100%;max-width:520px}.scan-manual .inp{flex:1}

/* states */
.center{padding:80px 24px;text-align:center;color:var(--ink2)}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--ink3);margin-top:8px}

/* login */
.login{max-width:360px;margin:12vh auto;padding:32px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.login h1{font-family:var(--head);font-size:26px;letter-spacing:2px;margin-bottom:6px}
.login p{color:var(--ink2);font-size:14px;margin-bottom:20px}
.login input{width:100%;margin-bottom:12px}
.login .btn{width:100%;padding:10px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:5vh 16px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;width:100%;max-width:680px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border)}
.mtitle{font-family:var(--head);font-size:22px;letter-spacing:1px;font-weight:700}
.msub{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:3px}
.x{background:none;border:none;color:var(--ink3);font-size:20px;cursor:pointer;line-height:1}
.x:hover{color:var(--ink)}
.mbody{padding:18px 22px;display:flex;flex-direction:column;gap:18px}
.sect-t{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--ink3);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--ink2)}
.field.full{grid-column:1/-1}
.inp{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:8px 10px;font-size:14px;outline:none;width:100%;font-family:var(--mono)}
.inp.text{font-family:var(--body)}
.inp:focus{border-color:var(--blue)}
.inp:disabled{opacity:.35}
.inp.bad{border-color:var(--red)}
.inp.changed{border-color:var(--amber)}
.stores{width:100%;border-collapse:collapse}
.stores th{background:none;padding:4px 6px;text-align:left}
.stores td{border:none;padding:4px 6px;font-family:var(--body);font-size:14px;text-align:left;min-width:0}
.stores td:first-child{min-width:150px}
.stores .inp{min-width:70px}
.sname{display:flex;align-items:center;gap:8px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.franklin{background:var(--col-franklin)}.dot.gulch{background:var(--col-gulch)}.dot.henderson{background:var(--col-henderson)}
.note{font-size:12px;color:var(--ink3)}
.quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mfoot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--border);flex-wrap:wrap}
.status{margin-right:auto;font-size:13px;color:var(--ink2);max-width:100%}
.status.ok{color:var(--green)}.status.bad{color:var(--red)}.status.warn{color:var(--amber)}
input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px}

.toast{position:fixed;bottom:22px;right:22px;left:auto;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:12px 16px;font-size:14px;z-index:300;max-width:min(420px,calc(100vw - 32px));box-shadow:0 8px 28px rgba(0,0,0,.4);transition:opacity .2s,transform .2s;opacity:0;transform:translateY(8px);pointer-events:none}
.toast.show{opacity:1;transform:none}

@media (max-width:700px){
  .header,.totals,.filters,.main{padding-left:16px;padding-right:16px}
  .header{position:static}
  #installBtn{padding:5px 9px;font-size:11.5px}
  .filters{position:static}
  .brand img{height:28px}
  .tval{font-size:22px}
  .totals{gap:16px}
  .cat-tot{gap:12px}
  .grid2{grid-template-columns:1fr}
  .count{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<header class="header">
  <div class="brand">
    <img src="https://cdn.shopify.com/s/files/1/0685/2647/3535/files/NSP_Logo_Updated_10.24.png?v=1730203346" alt="Nutrishop">
    <div class="brand-div"></div>
    <div class="brand-sub">INVENTORY</div>
    <button class="btn btn-green btn-sm" id="installBtn" type="button" hidden>⬇ Install app</button>
  </div>
  <nav class="tabs" id="tabs" hidden>
    <button data-view="inventory">Inventory</button>
    <button data-view="count">Count</button>
    <button data-view="reports">Reports</button>
    <button data-view="users">Employees</button>
  </nav>
  <div class="hdr-right" id="hdrRight" hidden>
    <span class="inv-only hdr-right">
      <div class="pill" id="pill"><div class="pdot"></div><span id="pillTxt">Not synced</span></div>
      <button class="btn btn-ghost" id="csvBtn">↓ CSV</button>
      <button class="btn btn-green" id="newBtn">+ New product</button>
      <button class="btn btn-primary" id="syncBtn">↺ Sync</button>
    </span>
    <span class="who" id="who"></span>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" title="Sign out">Sign out</button>
  </div>
</header>

<!-- Login -->
<form class="login" id="loginView" hidden>
  <h1>SIGN IN</h1>
  <p>Use the username and password your manager gave you.</p>
  <input class="inp text" id="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username" required>
  <input class="inp text" id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
  <div class="err" id="loginErr"></div>
  <button class="btn btn-primary" id="loginBtn" type="submit">Sign in</button>
</form>

<!-- App -->
<div id="appView" hidden>
  <section class="totals" id="totals" hidden>
    <div class="tcard"><div class="tlabel">PRODUCTS</div><div class="tval" id="tItems">—</div></div>
    <div class="tcard"><div class="tlabel">UNITS</div><div class="tval" id="tQty">—</div></div>
    <div class="tcard"><div class="tlabel">RETAIL VALUE</div><div class="tval green" id="tRetail">—</div></div>
    <div class="tcard"><div class="tlabel">COST VALUE</div><div class="tval amber" id="tCost">—</div></div>
    <div class="tcard"><div class="tlabel">GROSS MARGIN</div><div class="tval green" id="tMargin">—</div></div>
    <button class="tcard" data-stock="low" title="Show low stock"><div class="tlabel">LOW STOCK</div><div class="tval amber" id="tLow">—</div></button>
    <button class="tcard" data-stock="out" title="Show out of stock"><div class="tlabel">OUT OF STOCK</div><div class="tval red" id="tOut">—</div></button>
  </section>

  <section class="filters" id="filters" hidden>
    <label class="search"><span>⌕</span><input id="q" type="search" placeholder="Search name, SKU, UPC…  ( / )" autocomplete="off"></label>
    <button class="btn btn-primary btn-sm" id="invScan" type="button" title="Scan a barcode with the camera">📷 Scan</button>
    <div class="seg" id="locSeg" role="group" aria-label="Store"></div>
    <select class="select" id="catSel" aria-label="Category"><option value="">All categories</option></select>
    <select class="select" id="stockSel" aria-label="Stock">
      <option value="all">All stock</option>
      <option value="in">In stock only</option>
      <option value="low">Low stock</option>
      <option value="out">Out of stock</option>
      <option value="missing">Missing from a store</option>
    </select>
    <label class="note" style="display:flex;align-items:center;gap:6px">Low ≤ <input class="inp" id="lowIn" type="number" min="0" step="1" value="3" style="width:60px;padding:5px 8px"></label>
    <select class="select" id="sortSel" aria-label="Sort">
      <option value="name:1">Sort: Name A→Z</option>
      <option value="name:-1">Sort: Name Z→A</option>
      <option value="qty:-1">Sort: Qty high→low</option>
      <option value="qty:1">Sort: Qty low→high</option>
      <option value="margin:-1">Sort: Margin high→low</option>
      <option value="margin:1">Sort: Margin low→high</option>
      <option value="retail:-1">Sort: Retail total high→low</option>
      <option value="custom" hidden>Sort: by column</option>
    </select>
    <button class="btn btn-ghost btn-sm" id="collapseBtn">Expand all</button>
    <span class="count" id="count"></span>
  </section>

  <main class="main" id="main"></main>
</div>

<!-- Count (employees + admin) -->
<div id="countView" class="page" hidden></div>
<!-- Reports (admin) -->
<div id="reportsView" class="page" hidden></div>
<!-- Employees (admin) -->
<div id="usersView" class="page" hidden></div>

<div class="scan" id="scanOverlay" hidden role="dialog" aria-modal="true" aria-label="Barcode scanner">
  <div class="scan-top"><span class="ctitle" id="scanTitle">Scan</span><button class="x" id="scanClose" aria-label="Close scanner">✕</button></div>
  <div id="scanReader"></div>
  <div class="scan-msg" id="scanMsg"></div>
  <div class="crow scan-manual"><input class="inp" id="scanManual" inputmode="numeric" autocomplete="off" placeholder="…or type the barcode number"><button class="btn btn-ghost btn-sm" id="scanManualGo" type="button">Go</button></div>
</div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
'use strict';
/* ── Config ─────────────────────────────────────────────
   When hosted on Firebase, the API lives on Render.
   When served by the Render server itself (/app), same origin. */
const API = /\.(web\.app|firebaseapp\.com)$/.test(location.hostname)
  ? 'https://clover-proxy-hs3q.onrender.com/api'
  : '/api';

/* ── Utilities ── */
const $ = id => document.getElementById(id);
const ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);
const norm = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const usd = new Intl.NumberFormat('en-US', {style:'currency', currency:'USD'});
const money = c => usd.format((c || 0) / 100);
const num = n => n.toLocaleString('en-US');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
function toast(msg, ms = 3500) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms);
}
function setPill(kind, text) { $('pill').className = 'pill ' + kind; $('pillTxt').textContent = text; }

/* ── State ── */
const S = {
  stores: [], products: [], categories: [], syncedAt: null,
  q: '', loc: ls.get('inv.loc') || 'all', cat: '', stock: ls.get('inv.stock') || 'all', low: Number(ls.get('inv.low')) || 3,
  open: new Set(readJSON('inv.open', [])),          // categories start closed
  searchClosed: new Set(),                           // closed while a search is active
  sort: readJSON('inv.sort', { key: 'name', dir: 1 }),
};
function readJSON(k, fallback) { try { return JSON.parse(ls.get(k)) ?? fallback; } catch { return fallback; } }
const storeName = id => S.stores.find(s => s.id === id)?.name || id;

/* ── Auth + API ── */
const auth = {
  token() {
    const exp = Number(ls.get('inv.exp'));
    return exp > Date.now() ? ls.get('inv.token') : null;
  },
  save(t, exp) { ls.set('inv.token', t); ls.set('inv.exp', String(exp)); },
  clear() { ls.del('inv.token'); ls.del('inv.exp'); },
};
class SignedOut extends Error {}
async function api(path, { method = 'GET', body } = {}) {
  const tok = auth.token();
  let res;
  try {
    res = await fetch(API + path, {
      method,
      headers: { ...(tok ? { Authorization: 'Bearer ' + tok } : {}), ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch { throw new Error('Can’t reach the server. Check your connection and try again.'); }
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && path !== '/login') { auth.clear(); showLogin(data.error); throw new SignedOut(); }
  if (!res.ok) throw new Error(data.error || `Server error (${res.status})`);
  return data;
}

const VIEWS = ['appView', 'countView', 'reportsView', 'usersView'];
function showLogin(msg) {
  modalBusy = false; closeModal();
  VIEWS.forEach(v => $(v).hidden = true);
  $('hdrRight').hidden = true; $('tabs').hidden = true; $('loginView').hidden = false;
  $('loginErr').textContent = msg || '';
  $('user').value = ls.get('inv.lastUser') || '';
  $('pw').value = '';
  ($('user').value ? $('pw') : $('user')).focus();
}
$('loginView').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'Signing in…';
  $('loginErr').textContent = '';
  const slow = setTimeout(() => { btn.textContent = 'Waking server (up to a minute)…'; }, 4000);
  try {
    const r = await api('/login', { method: 'POST', body: { username: $('user').value.trim(), password: $('pw').value } });
    auth.save(r.token, r.expiresAt);
    ls.set('inv.lastUser', r.user.username);
    ls.set('inv.user', JSON.stringify(r.user));
    startApp(r.user);
  } catch (err) { $('loginErr').textContent = err.message; }
  clearTimeout(slow); btn.disabled = false; btn.textContent = 'Sign in';
});
$('logoutBtn').onclick = async () => {
  if (typeof flushCount === 'function') await flushCount().catch(() => {});   // never lose typed counts
  auth.clear(); ls.del('inv.user'); S.products = []; S.loaded = false; showLogin();
};

/* ── Data ── */
function indexProduct(p) {
  p._hay = norm([p.name, p.category, ...Object.values(p.stores).flatMap(i => [i.sku, i.code, ...(i.labels || [])])].join(' '));
}
async function sync(fresh) {
  const btn = $('syncBtn'); btn.disabled = true; btn.textContent = '⏳ Syncing';
  setPill('loading', 'Syncing…');
  if (!S.products.length) $('main').innerHTML = `<div class="center"><div class="spinner"></div><div id="loadMsg">Loading inventory from Clover…</div></div>`;
  const slow = setTimeout(() => { const m = $('loadMsg'); if (m) m.innerHTML = 'Waking the server…<div class="hint">The first load after a quiet period can take up to a minute.</div>'; }, 5000);
  try {
    const d = await api('/inventory' + (fresh ? '?fresh=1' : ''));
    S.stores = d.stores; S.categories = d.categories; S.labels = d.labels || []; S.syncedAt = new Date(d.syncedAt);
    S.products = d.products; S.products.forEach(indexProduct);
    if (S.loc !== 'all' && !S.stores.some(s => s.id === S.loc)) S.loc = 'all';
    buildFilters();
    render();
    $('totals').hidden = false; $('filters').hidden = false;
    if (d.errors.length) {
      setPill('error', 'Partial sync');
      toast('⚠ ' + d.errors.map(e => `${storeName(e.store)}: ${e.message}`).join(' · '), 8000);
    } else {
      setPill('live', 'Synced ' + S.syncedAt.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
    }
  } catch (err) {
    if (!(err instanceof SignedOut)) {
      setPill('error', 'Error');
      if (!S.products.length) $('main').innerHTML = `<div class="center">❌ ${esc(err.message)}<div class="hint"><button class="btn btn-ghost" onclick="sync(true)">Try again</button></div></div>`;
      else toast('❌ ' + err.message, 6000);
    }
  }
  clearTimeout(slow);
  btn.disabled = false; btn.textContent = '↺ Sync';
}

/* ── Filters ── */
function buildFilters() {
  $('locSeg').innerHTML = [{ id: 'all', name: 'All' }, ...S.stores].map(s =>
    `<button data-loc="${s.id}" aria-pressed="${S.loc === s.id}">${esc(s.name.toUpperCase())}</button>`).join('');
  const cats = [...new Set(S.products.map(p => p.category))].sort();
  $('catSel').innerHTML = '<option value="">All categories</option>' + cats.map(c => `<option${c === S.cat ? ' selected' : ''}>${esc(c)}</option>`).join('');
  $('lowIn').value = S.low;
  $('stockSel').value = S.stock;
  $('stockSel').querySelector('[value=missing]').hidden = S.loc !== 'all';
}
$('locSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-loc]'); if (!b) return;
  S.loc = b.dataset.loc; ls.set('inv.loc', S.loc);
  if (S.loc !== 'all' && S.stock === 'missing') { S.stock = 'all'; $('stockSel').value = 'all'; }
  buildFilters(); render();
});
$('q').addEventListener('input', debounce(() => { S.q = $('q').value; S.searchClosed.clear(); render(); }, 120));
$('catSel').onchange = () => { S.cat = $('catSel').value; render(); };
$('stockSel').onchange = () => { S.stock = $('stockSel').value; ls.set('inv.stock', S.stock); render(); };
$('lowIn').addEventListener('input', debounce(() => { const v = parseInt($('lowIn').value, 10); if (v >= 0) { S.low = v; ls.set('inv.low', v); render(); } }, 200));
document.querySelectorAll('[data-stock]').forEach(b => b.onclick = () => { S.stock = b.dataset.stock; $('stockSel').value = S.stock; render(); });
/* Categories start closed. While searching, matches show open so you can see them. */
const searching = () => S.q.trim() !== '';
const isOpen = cat => searching() ? !S.searchClosed.has(cat) : S.open.has(cat);
function setOpen(cat, open) {
  if (searching()) open ? S.searchClosed.delete(cat) : S.searchClosed.add(cat);
  else { open ? S.open.add(cat) : S.open.delete(cat); ls.set('inv.open', JSON.stringify([...S.open])); }
}
$('collapseBtn').onclick = () => {
  const cats = [...document.querySelectorAll('.cat')].map(c => c.dataset.cat);
  const anyOpen = cats.some(isOpen);
  cats.forEach(c => setOpen(c, !anyOpen));
  render();
};

/* Sorting (applies inside every category) */
const SORT_DEFAULT_DIR = { name: 1 };                 // text A→Z, numbers high→low first
function setSort(key, dir) {
  S.sort = { key, dir: dir ?? (S.sort.key === key ? -S.sort.dir : (SORT_DEFAULT_DIR[key] ?? -1)) };
  ls.set('inv.sort', JSON.stringify(S.sort));
  render();
}
$('sortSel').onchange = () => { const [k, d] = $('sortSel').value.split(':'); setSort(k, Number(d)); };
function sortValue({ p, st }, key) {
  switch (key) {
    case 'name': return null;
    case 'price': return st.pmin;
    case 'cost': return st.cmin;
    case 'qty': return st.qty;
    case 'retail': return st.retail;
    case 'costTotal': return st.cost;
    case 'margin': return st.margin;
    default: { const it = p.stores[key]; return it ? (it.qty ?? 0) : null; } // a store column
  }
}
function sortRows(g) {
  const { key, dir } = S.sort;
  return g.sort((a, b) => {
    if (key !== 'name') {
      const va = sortValue(a, key), vb = sortValue(b, key);
      if (va === null && vb !== null) return 1;          // blanks always last
      if (vb === null && va !== null) return -1;
      if (va !== vb && va !== null) return (va - vb) * dir;
      return a.p.name.localeCompare(b.p.name);
    }
    return a.p.name.localeCompare(b.p.name) * dir;
  });
}
function th(label, key, cls = '', title = '') {
  const on = S.sort.key === key;
  return `<th data-sort="${key}" class="${cls}${on ? ' sorted' : ''}" title="${esc(title || 'Sort by ' + label.toLowerCase())}" aria-sort="${on ? (S.sort.dir > 0 ? 'ascending' : 'descending') : 'none'}">${esc(label)} <span class="arr">${on ? (S.sort.dir > 0 ? '▲' : '▼') : ''}</span></th>`;
}

/* ── View math ── */
function viewStores() { return S.loc === 'all' ? S.stores.map(s => s.id) : [S.loc]; }
function stats(p, ids) {
  let qty = 0, retail = 0, cost = 0, carried = 0, low = false, out = false, pmin = Infinity, pmax = -Infinity, cmin = Infinity, cmax = -Infinity;
  for (const id of ids) {
    const it = p.stores[id]; if (!it) continue;
    carried++;
    const q = it.qty ?? 0, pos = Math.max(q, 0);
    qty += q; retail += pos * it.price; cost += pos * it.cost;
    if (q <= 0) out = true; else if (q <= S.low) low = true;
    pmin = Math.min(pmin, it.price); pmax = Math.max(pmax, it.price);
    cmin = Math.min(cmin, it.cost); cmax = Math.max(cmax, it.cost);
  }
  const margin = carried && pmin > 0 ? (pmin - cmax) / pmin * 100 : null;
  return { qty, retail, cost, carried, low, out, pmin, pmax, cmin, cmax, margin };
}
function filtered() {
  const ids = viewStores();
  const terms = norm(S.q).split(' ').filter(Boolean);
  const out = [];
  for (const p of S.products) {
    const st = stats(p, ids);
    if (!st.carried) continue;
    if (S.cat && p.category !== S.cat) continue;
    if (terms.length && !terms.every(t => p._hay.includes(t))) continue;
    if (S.stock === 'in' && st.qty <= 0) continue;
    if (S.stock === 'low' && !st.low) continue;
    if (S.stock === 'out' && !st.out) continue;
    if (S.stock === 'missing' && st.carried === S.stores.length) continue;
    out.push({ p, st });
  }
  return out;
}

/* ── Render ── */
function priceCell(min, max) {
  return min === max ? money(min) : `<span class="vary" title="Differs by store">${money(min)}–${money(max)}</span>`;
}
function qtyCell(q) {
  if (q === null || q === undefined) return '<span class="nc" title="Not carried">✕</span>';
  const cls = q <= 0 ? 'q0' : q <= S.low ? 'qlow' : '';
  return `<span class="${cls}">${num(q)}</span>`;
}
function render() {
  const rows = filtered();
  const all = S.loc === 'all';
  // totals
  let tq = 0, tr = 0, tc = 0, tl = 0, to = 0;
  for (const { st } of rows) { tq += st.qty; tr += st.retail; tc += st.cost; if (st.low) tl++; if (st.out) to++; }
  $('tItems').textContent = num(rows.length);
  $('tQty').textContent = num(tq);
  $('tRetail').textContent = money(tr);
  $('tCost').textContent = money(tc);
  $('tMargin').textContent = tr > 0 ? ((tr - tc) / tr * 100).toFixed(1) + '%' : '—';
  $('tLow').textContent = num(tl); $('tOut').textContent = num(to);
  $('count').textContent = `${num(rows.length)} of ${num(S.products.length)} products`;

  if (!rows.length) { $('main').innerHTML = '<div class="center">No products match these filters.</div>'; return; }

  const groups = new Map();
  for (const r of rows) { const g = groups.get(r.p.category) || []; g.push(r); groups.set(r.p.category, g); }
  const locTh = all ? S.stores.map(s => th(s.name.slice(0, 1), s.id, 'th-' + s.id, `${s.name} qty — click to sort`)).join('') : '';
  const sv = `${S.sort.key}:${S.sort.dir}`;
  $('sortSel').value = [...$('sortSel').options].some(o => o.value === sv) ? sv : 'custom';
  let anyOpen = false;
  const html = [];
  for (const cat of [...groups.keys()].sort()) {
    const g = sortRows(groups.get(cat));
    let cq = 0, cr = 0, cc = 0;
    const body = g.map(({ p, st }) => {
      cq += st.qty; cr += st.retail; cc += st.cost;
      const f0 = Object.values(p.stores)[0] || {};
      const sku = [f0.sku, ...(f0.labels || []), f0.isRevenue === false ? 'Non-revenue' : ''].filter(Boolean).join(' · ');
      const locTd = all ? S.stores.map(s => `<td>${qtyCell(p.stores[s.id]?.qty ?? (p.stores[s.id] ? 0 : null))}</td>`).join('') : '';
      return `<tr><td>${esc(p.name)}<button class="edit" data-edit="${esc(p.key)}">✎ EDIT</button>${sku ? `<span class="sku">${esc(sku)}</span>` : ''}</td>
        <td>${priceCell(st.pmin, st.pmax)}</td><td class="a">${priceCell(st.cmin, st.cmax)}</td>${locTd}
        <td>${qtyCell(st.qty)}</td><td class="g">${money(st.retail)}</td><td class="a">${money(st.cost)}</td>
        <td class="m">${st.margin === null ? '—' : st.margin.toFixed(0) + '%'}</td></tr>`;
    }).join('');
    const closed = !isOpen(cat);
    if (!closed) anyOpen = true;
    html.push(`<section class="cat${closed ? ' closed' : ''}" data-cat="${esc(cat)}">
      <button class="cat-head" data-toggle aria-expanded="${!closed}">
        <span class="cat-left"><span class="chev">▶</span><span class="cat-name">${esc(cat.toUpperCase())}</span><span class="cat-n">${g.length}</span></span>
        <span class="cat-tot"><span><b>UNITS</b>${num(cq)}</span><span class="g"><b>RETAIL</b>${money(cr)}</span><span class="a"><b>COST</b>${money(cc)}</span></span>
      </button>
      ${closed ? '' : `<div class="tw"><table>
        <thead><tr>${th('ITEM', 'name')}${th('PRICE', 'price')}${th('COST', 'cost')}${locTh}${th('QTY', 'qty')}${th('RETAIL TOTAL', 'retail')}${th('COST TOTAL', 'costTotal')}${th('MARGIN', 'margin')}</tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr><td>TOTAL</td><td></td><td></td>${all ? S.stores.map(() => '<td></td>').join('') : ''}<td>${num(cq)}</td><td class="g">${money(cr)}</td><td class="a">${money(cc)}</td><td></td></tr></tfoot>
      </table></div>`}
    </section>`);
  }
  $('main').innerHTML = html.join('');
  $('collapseBtn').textContent = anyOpen ? 'Collapse all' : 'Expand all';
}
$('main').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]');
  if (ed) { openEdit(ed.dataset.edit); return; }
  const so = e.target.closest('[data-sort]');
  if (so) { setSort(so.dataset.sort); return; }
  const tg = e.target.closest('[data-toggle]');
  if (tg) {
    const cat = tg.closest('.cat').dataset.cat;
    setOpen(cat, !isOpen(cat));
    render();
  }
});

/* ── Modal plumbing ── */
let modalBusy = false;
function openModal(html) { $('modal').style.maxWidth = ''; $('modal').innerHTML = html; $('overlay').hidden = false; document.body.style.overflow = 'hidden'; }
function closeModal() { if (modalBusy) return; $('overlay').hidden = true; $('modal').innerHTML = ''; document.body.style.overflow = ''; }
$('overlay').addEventListener('mousedown', e => { if (e.target === $('overlay')) closeModal(); });
$('modal').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('overlay').hidden) closeModal();
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && $('overlay').hidden && !$('appView').hidden && !$('filters').hidden) { e.preventDefault(); $('q').focus(); }
});
function setStatus(msg, kind = '') { const s = $('mStatus'); if (s) { s.textContent = msg; s.className = 'status ' + kind; } }

/* Reads a $ or qty input. Returns {ok, value} — blank is an error, never zero. */
function readNum(el, { integer = false } = {}) {
  const raw = el.value.trim();
  const n = Number(raw);
  const ok = raw !== '' && Number.isFinite(n) && (integer ? Number.isInteger(n) : n >= 0);
  el.classList.toggle('bad', !ok);
  return { ok, value: n };
}
const centsOf = d => Math.round(d * 100);

/* ── Edit product ── */
let editing = null;
function openEdit(key) {
  const p = S.products.find(x => x.key === key); if (!p) return;
  editing = p;
  const first = Object.values(p.stores)[0];
  const ids = Object.values(p.stores).map(i => [i.sku && 'SKU ' + i.sku, i.code && 'UPC ' + i.code]).flat().filter(Boolean);
  const rows = S.stores.map(s => {
    const it = p.stores[s.id];
    const src = it || first;
    const dis = it ? '' : ' disabled';
    return `<tr data-store="${s.id}">
      <td>${it
        ? `<span class="sname"><span class="dot ${s.id}"></span>${esc(s.name)}</span>`
        : `<label class="sname"><input type="checkbox" name="add"><span class="dot ${s.id}"></span>${esc(s.name)} <span class="tag">NOT CARRIED</span></label>`}</td>
      <td><input class="inp" name="price" type="number" min="0" step="0.01" value="${(src.price / 100).toFixed(2)}" data-orig="${it ? src.price : ''}"${dis}></td>
      <td><input class="inp" name="cost" type="number" min="0" step="0.01" value="${(src.cost / 100).toFixed(2)}" data-orig="${it ? src.cost : ''}"${dis}></td>
      <td><input class="inp" name="qty" type="number" step="1" value="${it ? (it.qty ?? 0) : 0}" data-orig="${it ? (it.qty ?? '') : ''}"${dis}></td>
    </tr>`;
  }).join('');
  openModal(`
    <div class="mhead"><div><div class="mtitle">${esc(p.name)}</div><div class="msub">${esc(p.category)}${ids.length ? ' · ' + esc([...new Set(ids)].join(' · ')) : ''}</div></div><button class="x" data-close aria-label="Close">✕</button></div>
    <div class="mbody">
      <div>
        <div class="sect-t">DETAILS — EVERY STORE THAT CARRIES IT${detailsVary(p) ? ' <span class="varies">(currently differs between stores — showing ' + esc(storeName(Object.keys(p.stores)[0])) + ')</span>' : ''}</div>
        <div class="grid2">
          <div class="field" data-df="category"><label for="dCat">Category</label><input class="inp text" id="dCat" list="catList" autocomplete="off" value="${esc(p.category === 'Uncategorized' ? '' : p.category)}" placeholder="Pick or type a new one"></div>
          <div class="field" data-df="sku"><label for="dSku">SKU</label><input class="inp" id="dSku" maxlength="64" autocomplete="off" value="${esc(first.sku)}"></div>

function markChanged() {

    const v = i.value.trim();
    const cur = i.name === 'qty' ? Number(v) : centsOf(Number(v));
    i.classList.toggle('changed', v !== '' && cur !== Number(o));
  });
}
async function saveEdit() {
  const p = editing, m = $('modal');
  const changes = [], adds = {};
  let bad = false;
  for (const s of S.stores) {
    const tr = m.querySelector(`tr[data-store="${s.id}"]`);
    const it = p.stores[s.id];
    const add = tr.querySelector('[name=add]');
    if (!it && !add.checked) continue;
    const price = readNum(tr.querySelector('[name=price]'));
    const cost = readNum(tr.querySelector('[name=cost]'));
    const qty = readNum(tr.querySelector('[name=qty]'), { integer: true });
    if (!price.ok || !cost.ok || !qty.ok) { bad = true; continue; }
    if (it) {
      const c = { store: s.id, itemId: it.id };
      if (centsOf(price.value) !== it.price) c.price = price.value;
      if (centsOf(cost.value) !== it.cost) c.cost = cost.value;
      if (qty.value !== it.qty) c.qty = qty.value;
      if (Object.keys(c).length > 2) changes.push(c);
    } else {
      adds[s.id] = { price: price.value, cost: cost.value, qty: qty.value };
    }
  }
  if (bad) { setStatus('Fill in every highlighted box (prices can’t be blank or negative).', 'bad'); return; }
  const touched = f => m.querySelector(`[data-df="${f}"]`).classList.contains('changed');
  const details = {};
  if (touched('category')) details.category = $('dCat').value.trim();
  if (touched('sku')) details.sku = $('dSku').value.trim();
  if (touched('code')) details.code = $('dCode').value.trim();
  if (touched('isRevenue')) details.isRevenue = $('dRev').checked;
  if (touched('labels')) details.labels = pickedLabels('d');
  const targets = Object.entries(p.stores).map(([store, it]) => ({ store, itemId: it.id }));
  const hasDetails = Object.keys(details).length > 0;
  if (!changes.length && !Object.keys(adds).length && !hasDetails) { setStatus('Nothing changed.'); return; }

  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'Saving…'; modalBusy = true;
  setStatus('Sending to Clover…');
  const errors = [], saved = [];
  try {
    const f0 = Object.values(p.stores)[0] || {};
    const [upd, crt, det] = await Promise.all([
      changes.length ? api('/items/update', { method: 'POST', body: { changes } }) : { results: [] },
      Object.keys(adds).length ? api('/items/create', { method: 'POST', body: {
        name: p.name, sku: details.sku ?? f0.sku ?? '', code: details.code ?? f0.code ?? '',
        category: details.category ?? (p.category === 'Uncategorized' ? '' : p.category),
        isRevenue: details.isRevenue ?? f0.isRevenue !== false, labels: details.labels ?? f0.labels ?? [], stores: adds } }) : { results: [] },
      hasDetails ? api('/items/details', { method: 'POST', body: { targets, ...details } }) : { results: [] },
    ]);
    for (const r of det.results) {
      const it = p.stores[r.store];
      if (it && r.itemId === it.id) Object.assign(it, r.saved);
      if (r.saved?.category !== undefined) {
        p.category = r.saved.category || 'Uncategorized';
        if (r.saved.category && !S.categories.includes(r.saved.category)) S.categories.push(r.saved.category);
      }
      (r.saved?.labels || []).forEach(l => { if (!S.labels.includes(l)) S.labels.push(l); });
      if (!r.ok) errors.push(`${storeName(r.store)}: ${r.errors.join('; ')}`);
      else if (!saved.includes(storeName(r.store))) saved.push(storeName(r.store));
    }
    p.sku = Object.values(p.stores)[0]?.sku; p.code = Object.values(p.stores)[0]?.code;
    for (const r of upd.results) {
      const it = p.stores[r.store];
      if (it && r.itemId === it.id) Object.assign(it, r.saved);
      const partly = Object.keys(r.saved || {});
      if (r.ok) saved.push(storeName(r.store));
      else {
        if (partly.length) saved.push(`${storeName(r.store)} (${partly.join(', ')})`);
        errors.push(`${storeName(r.store)}: ${r.errors.join('; ')}`);
      }
    }
    for (const r of crt.results) {
      if (r.ok) { p.stores[r.store] = r.item; saved.push(storeName(r.store) + ' (added)'); }
      if (r.errors?.length) errors.push(`${storeName(r.store)}: ${r.errors.join('; ')}`);
    }
  } catch (err) {
    if (err instanceof SignedOut) { modalBusy = false; return; }
    errors.push(err.message);
  }
  modalBusy = false;
  indexProduct(p); buildFilters(); render();
  btn.disabled = false; btn.textContent = 'Save to Clover';
  if (errors.length) {
    setStatus((saved.length ? `Saved: ${saved.join(', ')}. ` : '') + 'Problems — ' + errors.join(' · '), saved.length ? 'warn' : 'bad');
    openEditKeepStatus(p);
  } else {
    toast(`✅ Saved ${p.name} — ${saved.join(', ')}`);
    closeModal();
  }
}

function wireLabelPicker(prefix, onChange) {
  const box = $(prefix + 'Lbls');
  box.addEventListener('change', e => { if (e.target.type === 'checkbox') onChange(); });

    const v = $(prefix + 'NewLbl').value.trim(); if (!v) return;

const pickedLabels = prefix => [...$(prefix + 'Lbls').querySelectorAll('input[type=checkbox]:checked')].map(c => c.value);
function detailsVary(p) {

async function createProduct() {
  const m = $('modal');
  const name = $('nName').value.trim();
  $('nName').classList.toggle('bad', !name);
  const price = readNum($('nPrice')), cost = readNum($('nCost'));
  const stores = {};
  let bad = !name || !price.ok || !cost.ok;
  m.querySelectorAll('tbody tr').forEach(tr => {
    if (!tr.querySelector('[name=on]').checked) return;
    const q = readNum(tr.querySelector('[name=qty]'), { integer: true });
    const o = { qty: q.value };
    for (const f of ['price', 'cost']) {
      const el = tr.querySelector(`[name=${f}]`);
      if (el.value.trim() === '') { el.classList.remove('bad'); continue; }
      const r = readNum(el); if (!r.ok) bad = true; else o[f] = r.value;
    }
    if (!q.ok) bad = true;
    stores[tr.dataset.store] = o;
  });
  if (bad) { setStatus('Fix the highlighted fields.', 'bad'); return; }
  if (!Object.keys(stores).length) { setStatus('Pick at least one store.', 'bad'); return; }

  const btn = $('createBtn'); btn.disabled = true; btn.textContent = 'Creating…'; modalBusy = true;
  setStatus('Creating in Clover…');
  const category = $('nCat').value.trim();
  try {
    const r = await api('/items/create', { method: 'POST', body: {
      name, category, sku: $('nSku').value.trim(), code: $('nCode').value.trim(),
      isRevenue: $('nRev').checked, labels: pickedLabels('n'),
      price: price.value, cost: cost.value, stores } });
    modalBusy = false;
    const ok = r.results.filter(x => x.ok), errs = r.results.filter(x => x.errors?.length);
    if (ok.length) {
      let p = S.products.find(x => norm(x.name) === norm(name));
      if (!p) { p = { key: 'new:' + norm(name) + ':' + Date.now(), name, category: category || 'Uncategorized', stores: {} }; S.products.push(p); S.products.sort((a, b) => a.name.localeCompare(b.name)); }
      ok.forEach(x => { p.stores[x.store] = x.item; });
      if (category && !S.categories.includes(category)) S.categories.push(category);
      pickedLabels('n').forEach(l => { if (!S.labels.includes(l)) S.labels.push(l); });
      indexProduct(p); buildFilters(); render();
    }
    if (errs.length) {
      setStatus((ok.length ? `Created at ${ok.map(x => storeName(x.store)).join(', ')}. ` : '') + 'Problems — ' + errs.map(x => `${storeName(x.store)}: ${x.errors.join('; ')}`).join(' · '), ok.length ? 'warn' : 'bad');
      btn.disabled = false; btn.textContent = 'Create in Clover';
      if (ok.length) btn.hidden = true;
    } else {
      toast(`✅ Created ${name} at ${ok.map(x => storeName(x.store)).join(', ')}`);
      closeModal();
    }
  } catch (err) {
    modalBusy = false;
    if (err instanceof SignedOut) return;
    setStatus(err.message, 'bad'); btn.disabled = false; btn.textContent = 'Create in Clover';
  }
}

/* ── CSV (exports what's on screen) ── */
function csvCell(v) {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;          // stop spreadsheet formulas
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function exportCSV() {
  const rows = filtered();
  if (!rows.length) { toast('Nothing to export'); return; }
  const d = c => (c / 100).toFixed(2);
  const head = ['Category', 'Item', 'SKU', 'UPC', 'Revenue item', 'Labels',
    ...S.stores.flatMap(s => [`${s.name} Price`, `${s.name} Cost`, `${s.name} Qty`]),
    'Total Qty', 'Retail Total', 'Cost Total'];
  const lines = [head.map(csvCell).join(',')];
  const ids = S.stores.map(s => s.id);
  for (const { p } of rows) {
    const st = stats(p, ids);
    const first = Object.values(p.stores)[0] || {};
    lines.push([p.category, p.name, first.sku, first.code, first.isRevenue === false ? 'No' : 'Yes', (first.labels || []).join('; '),
      ...S.stores.flatMap(s => { const it = p.stores[s.id]; return it ? [d(it.price), d(it.cost), it.qty ?? 0] : ['', '', '']; }),
      st.qty, d(st.retail), d(st.cost)].map(csvCell).join(','));
  }
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `nutrishop-inventory-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`✅ Exported ${rows.length} products`);
}

function confirmBox(title, body, okLabel, okClass = 'btn-primary') {
  return new Promise(resolve => {
    openModal(`<div class="mhead"><div class="mtitle">${esc(title)}</div><button class="x" data-close aria-label="Close">✕</button></div>
      <div class="mbody"><div>${body}</div></div>
      <div class="mfoot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn ${okClass}" id="okBtn">${esc(okLabel)}</button></div>`);
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    $('okBtn').onclick = () => { finish(true); closeModal(); };
    const obs = new MutationObserver(() => { if ($('overlay').hidden) { obs.disconnect(); finish(false); } });
    obs.observe($('overlay'), { attributes: true });
  });
}

/* ════════════════ COUNTS ════════════════
   Every number typed is saved to the server within a second, and also kept
   on this device until the server confirms. Clover is only changed when
   someone presses "Submit to Clover" on the review screen. */
const C = { stores: [], count: null, items: [], lines: new Map(), pending: new Map(), q: '', onlyUncounted: false,
  open: new Set(), timer: null, saving: null };
const pendKey = id => 'cnt.pending.' + id;
const persistPending = () => { if (C.count) C.pending.size ? ls.set(pendKey(C.count.id), JSON.stringify([...C.pending])) : ls.del(pendKey(C.count.id)); };

function setSaved(state) {
  const el = $('savedTxt'); if (!el) return;
  el.className = 'saved' + (state === 'offline' ? ' warn' : '');
  el.textContent = state === 'saving' ? 'Saving…' : state === 'offline' ? '⚠ Offline — saved on this device' : '✓ Saved';
}
async function flushCount() {
  if (!C.count) return;
  if (C.saving) await C.saving.catch(() => {});
  if (!C.pending.size || !C.count) return;
  const sent = new Map(C.pending);
  const id = C.count.id;
  C.saving = (async () => {
    setSaved('saving');
    try {
      await api(`/counts/${id}/lines`, { method: 'PUT', body: { lines: [...sent].map(([itemId, counted]) => ({ itemId, counted })) } });
      for (const [k, v] of sent) if (C.pending.get(k) === v) C.pending.delete(k);
      persistPending();
      setSaved(C.pending.size ? 'saving' : 'saved');
    } catch (e) {
      if (/no longer open|already submitted/i.test(e.message)) countClosedUnderneath(e.message);
      else if (!(e instanceof SignedOut)) setSaved('offline');
      throw e;
    } finally { C.saving = null; }
  })();
  return C.saving;
}
const scheduleSave = () => { clearTimeout(C.timer); C.timer = setTimeout(() => flushCount().catch(() => {}), 600); };
setInterval(() => { if (C.pending.size && !C.saving && auth.token()) flushCount().catch(() => {}); }, 10000);
addEventListener('online', () => flushCount().catch(() => {}));
document.addEventListener('visibilitychange', () => { if (document.hidden) flushCount().catch(() => {}); });

function countClosedUnderneath(msg) {
  if (C.count) { ls.del(pendKey(C.count.id)); }
  C.pending.clear(); C.count = null; ls.del('cnt.id');
  toast('⚠ ' + msg, 6000);
  countHome(false);
}

async function countHome(resume = true) {
  const el = $('countView');
  el.innerHTML = spinner('Loading stores…');
  try {
    C.stores = (await api('/counts/stores')).stores;
    const resumeId = Number(ls.get('cnt.id'));
    if (resume && resumeId) {
      if (C.stores.some(s => s.open?.id === resumeId && s.open.status === 'open')) return openSheet(resumeId);
      ls.del('cnt.id');
    }
    renderPicker();
  } catch (e) { if (!(e instanceof SignedOut)) el.innerHTML = errorBox(e.message, 'countHome'); }
}

      <button class="btn ${s.open ? 'btn-primary' : 'btn-green'}" data-start="${s.id}"${s.open?.status === 'submitting' ? ' disabled' : ''}>${s.open ? 'Continue count →' : 'Start count →'}</button>

async function startCount(storeId) {
  $('countView').innerHTML = spinner('Opening count…');
  try { const r = await api('/counts', { method: 'POST', body: { store: storeId } }); await openSheet(r.count.id); }

}
async function openSheet(id) {
  $('countView').innerHTML = spinner('Loading count sheet…');
  const d = await api(`/counts/${id}`);
  if (d.count.status !== 'open') { ls.del('cnt.id'); toast('That count was already submitted.'); return countHome(false); }
  C.count = d.count; C.items = d.items;
  C.items.forEach(i => { i._hay = norm([i.name, i.sku, i.code, i.category].join(' ')); });
  C.lines = new Map(Object.entries(d.lines));
  C.pending = new Map(readJSON(pendKey(id), []));
  for (const [k, v] of C.pending) v === null ? C.lines.delete(k) : C.lines.set(k, { counted: v, by: ME.name });
  ls.set('cnt.id', String(id));
  C.q = ''; C.open = new Set();
  renderSheet();
  if (C.pending.size) flushCount().catch(() => {}); else setSaved('saved');
}
function renderSheet() {
  const c = C.count;
  $('countView').innerHTML = `<div class="ctool">
      <div class="crow">
        <button class="btn btn-ghost btn-sm" data-act="back">← Stores</button>
        <span class="ctitle"><span class="dot ${c.store}" style="display:inline-block"></span> ${esc(c.storeName.toUpperCase())}</span>
        <span class="saved" id="savedTxt"></span>

      </div>
      <div class="crow">
        <label class="search" style="max-width:none"><span>⌕</span><input id="cq" type="search" placeholder="Search or scan a barcode…" autocomplete="off" enterkeyhint="search"></label>
        <label class="chip"><input type="checkbox" id="cUncounted"${C.onlyUncounted ? ' checked' : ''}> Uncounted only</label>
        <button class="btn btn-primary btn-sm" data-act="camera" type="button">📷 Scan</button>

      </div>
    </div>
    <div id="cList"></div>`;
  $('cq').addEventListener('input', debounce(() => { C.q = $('cq').value; C.fromScan = false; renderList(); }, 150));
  $('cq').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); scanOrJump($('cq').value.trim()); } });
  $('cUncounted').onchange = () => { C.onlyUncounted = $('cUncounted').checked; renderList(); };
  renderList();
}
function updateProgress() {
  const el = $('cProg'); if (el) el.textContent = `${num(C.lines.size)} of ${num(C.items.length)} counted`;
}
function renderList(onlyIds = null) {
  const terms = onlyIds ? [] : norm(C.q).split(' ').filter(Boolean);
  const searching = terms.length > 0 || !!onlyIds;
  const groups = new Map(), totals = new Map();
  for (const it of C.items) {
    const t = totals.get(it.category) || { n: 0, done: 0 }; t.n++; if (C.lines.has(it.itemId)) t.done++; totals.set(it.category, t);
    if (onlyIds ? !onlyIds.has(it.itemId) : searching && !terms.every(w => it._hay.includes(w))) continue;
    if (C.onlyUncounted && C.lines.has(it.itemId)) continue;
    (groups.get(it.category) || groups.set(it.category, []).get(it.category)).push(it);
  }
  let anyOpen = false;
  const html = [...groups.keys()].sort().map(cat => {
    const list = groups.get(cat).sort((a, b) => a.name.localeCompare(b.name));
    const open = searching || C.open.has(cat);
    if (open) anyOpen = true;
    const t = totals.get(cat);
    return `<section class="cat${open ? '' : ' closed'}" data-cat="${esc(cat)}">
      <button class="cat-head" data-ctoggle aria-expanded="${open}">
        <span class="cat-left"><span class="chev">▶</span><span class="cat-name">${esc(cat.toUpperCase())}</span></span>
        <span class="cnt${t.done === t.n ? ' full' : ''}" data-ccnt>${num(t.done)} / ${num(t.n)}</span>
      </button>
      ${open ? `<div class="tw">${list.map(itemRow).join('')}</div>` : ''}
    </section>`;
  }).join('');
  $('cList').innerHTML = html || `<div class="center">${searching ? 'No items match that search.' : C.onlyUncounted ? '🎉 Everything has been counted.' : 'No items.'}</div>`;
  $('cExpand').textContent = anyOpen && !searching ? 'Collapse all' : 'Expand all';
  updateProgress();
}
function itemRow(it) {
  const l = C.lines.get(it.itemId);
  const ids = [it.sku, it.code && it.code !== it.sku ? it.code : ''].filter(Boolean).join(' · ');
  const other = l && l.by && l.by !== ME.name ? ` · counted by ${esc(l.by)}` : '';
  return `<div class="item${l ? ' done' : ''}" data-id="${esc(it.itemId)}">
    <div class="nm">${esc(it.name)}<small>${esc(ids)}${other}</small></div>
    <div class="stepper"><button type="button" data-step="-1" aria-label="Minus one">−</button><input class="inp" data-qty inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" autocomplete="off" value="${l ? l.counted : ''}" aria-label="Count for ${esc(it.name)}"><button type="button" data-step="1" aria-label="Plus one">+</button></div>
  </div>`;
}
function setCount(itemId, value) {
  if (value === null) C.lines.delete(itemId); else C.lines.set(itemId, { counted: value, by: ME.name });
  C.pending.set(itemId, value);
  persistPending(); scheduleSave(); setSaved('saving');
  const row = $('cList').querySelector(`.item[data-id="${CSS.escape(itemId)}"]`);
  if (row) {
    row.classList.toggle('done', value !== null);
    const inp = row.querySelector('[data-qty]');
    if (document.activeElement !== inp) inp.value = value ?? '';
    const sec = row.closest('.cat'), cat = sec.dataset.cat;
    const n = C.items.filter(i => i.category === cat), done = n.filter(i => C.lines.has(i.itemId)).length;
    const cc = sec.querySelector('[data-ccnt]'); cc.textContent = `${num(done)} / ${num(n.length)}`; cc.classList.toggle('full', done === n.length);
  }
  updateProgress();
}
/* Barcode matching: exact, or same digits ignoring leading zeros (UPC-A vs EAN-13). */
const codeDigits = v => String(v || '').replace(/^0+/, '');
function sameCode(scan, val) {
  if (!scan || !val) return false;
  const a = String(scan).trim().toLowerCase(), b = String(val).trim().toLowerCase();
  if (a === b) return true;
  return /^\d{6,}$/.test(a) && /^\d{6,}$/.test(b) && codeDigits(a) === codeDigits(b);
}
/* Returns {msg, close} so the camera knows what to show / whether to stop. */
function scanOrJump(code, fromCamera = false) {
  if (!code) return null;
  const hits = C.items.filter(i => sameCode(code, i.sku) || sameCode(code, i.code));
  if (hits.length === 1) {
    const it = hits[0];
    C.q = it.name; $('cq').value = it.name; renderListOnly([it]);
    C.fromScan = fromCamera;
    const inp = $('cList').querySelector(`.item[data-id="${CSS.escape(it.itemId)}"] [data-qty]`);
    if (inp) { inp.focus(); inp.select(); }
    return { msg: it.name, close: true };
  }
  if (hits.length > 1) {
    $('cq').value = code; C.q = ''; C.open = new Set(hits.map(h => h.category));
    renderListOnly(hits);
    toast(`${hits.length} items share barcode ${code} — pick the right one`, 4000);
    return { msg: `${hits.length} items share this barcode`, close: true };
  }
  if (!fromCamera && C.items.some(i => i._hay.includes(norm(code)))) return null; // typed text: normal search
  toast(`No item found for barcode “${code}” at this store`, 5000);
  return { msg: `✗ Not found: ${code}` };
}
/* Show just these items (used when several share a barcode). */
function renderListOnly(items) { renderList(new Set(items.map(i => i.itemId))); }

/* ════════════════ Camera barcode scanner ════════════════ */
const SCAN = { stream: null, timer: null, video: null, onCode: null, last: '', lastAt: 0, loading: null, dec: null, canvas: null };
function loadZXing() {
  if (window.ZXing) return Promise.resolve();
  return SCAN.loading ||= new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = (API === '/api' ? '' : 'https://clover-proxy-hs3q.onrender.com/app/') + 'vendor/zxing.min.js';
    el.onload = res; el.onerror = () => { SCAN.loading = null; rej(new Error('Couldn’t load the scanner. Check your connection.')); };
    document.head.appendChild(el);
  });
}
/* Prefer the phone's built-in barcode reader (Android Chrome); otherwise ZXing (iPhone, desktop). */
async function getDecoder() {
  if (SCAN.dec) return SCAN.dec;
  const formats = ['upc_a', 'upc_e', 'ean_13', 'ean_8', 'code_128', 'code_39', 'itf'];
  if ('BarcodeDetector' in window) {
    try {
      const have = await BarcodeDetector.getSupportedFormats();
      const use = formats.filter(f => have.includes(f));
      if (use.includes('ean_13') || use.includes('upc_a')) {
        const d = new BarcodeDetector({ formats: use });
        return SCAN.dec = { detect: async v => (await d.detect(v))[0]?.rawValue || null };
      }
    } catch {}
  }
  await loadZXing();
  const Z = window.ZXing, F = Z.BarcodeFormat;
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [F.UPC_A, F.UPC_E, F.EAN_13, F.EAN_8, F.CODE_128, F.CODE_39, F.ITF]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  return SCAN.dec = { detect: async v => {
    // Read the middle band of the picture at full camera resolution (barcodes are wide, not tall).
    const vw = v.videoWidth, vh = v.videoHeight; if (!vw || !vh) return null;
    const sh = Math.round(vh * 0.5), sy = Math.round((vh - sh) / 2);
    const scale = Math.min(1, 1280 / vw);
    canvas.width = Math.round(vw * scale); canvas.height = Math.round(sh * scale);
    ctx.drawImage(v, 0, sy, vw, sh, 0, 0, canvas.width, canvas.height);
    try {
      const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(canvas)));
      return reader.decodeWithState(bmp).getText();
    } catch { return null; } finally { reader.reset(); }
  } };
}
function cameraError(e) {
  const m = String(e?.message || e?.name || e);
  if (/NotAllowed|Permission|denied/i.test(m) || e?.name === 'NotAllowedError') return 'The camera is blocked. Allow camera access for this site in your browser settings and try again, or type the number below.';
  if (/NotFound|not found|Overconstrained/i.test(m) || e?.name === 'NotFoundError') return 'No camera found on this device. Type the number below instead.';
  if (!window.isSecureContext || !navigator.mediaDevices) return 'The camera only works on the secure (https) site.';
  return 'Couldn’t start the camera: ' + m;
}
async function openScanner({ title, onCode }) {
  Object.assign(SCAN, { onCode, last: '', lastAt: 0 });
  $('scanTitle').textContent = title;
  $('scanMsg').textContent = 'Starting camera…'; $('scanMsg').className = 'scan-msg';
  $('scanManual').value = '';
  $('scanReader').innerHTML = '<video playsinline muted autoplay></video><div class="scan-aim"></div>';
  SCAN.video = $('scanReader').querySelector('video');
  $('scanOverlay').hidden = false; document.body.style.overflow = 'hidden';
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('secure');
    const [stream, dec] = await Promise.all([
      navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } }),
      getDecoder(),
    ]);
    if ($('scanOverlay').hidden) { stream.getTracks().forEach(t => t.stop()); return; }   // closed while starting
    SCAN.stream = stream;
    const track = stream.getVideoTracks()[0];
    try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch {}
    SCAN.video.srcObject = stream;
    await SCAN.video.play().catch(() => {});
    $('scanMsg').textContent = 'Point the camera at the barcode.';
    const tick = async () => {
      if (!SCAN.stream) return;
      if (SCAN.video.readyState >= 2) {
        const code = await dec.detect(SCAN.video).catch(() => null);
        if (code && SCAN.stream) handleScan(code);
      }
      if (SCAN.stream) SCAN.timer = setTimeout(tick, 120);
    };
    tick();
  } catch (e) { $('scanMsg').textContent = cameraError(e); $('scanMsg').className = 'scan-msg bad'; }
}
async function closeScanner() {
  $('scanOverlay').hidden = true; document.body.style.overflow = '';
  clearTimeout(SCAN.timer);
  if (SCAN.stream) SCAN.stream.getTracks().forEach(t => t.stop());
  SCAN.stream = null;
  if (SCAN.video) SCAN.video.srcObject = null;
  $('scanReader').innerHTML = '';
}
function handleScan(text) {
  const code = String(text || '').trim(); if (!code) return;
  try { navigator.vibrate?.(60); } catch {}
  closeScanner();
  SCAN.onCode(code);
}
$('scanClose').onclick = closeScanner;
$('scanManualGo').onclick = () => { const v = $('scanManual').value.trim(); if (v) { SCAN.last = ''; handleScan(v); $('scanManual').value = ''; } };
$('scanManual').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('scanManualGo').click(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('scanOverlay').hidden) closeScanner(); });

/* Inventory page: scan → open that product (or offer to create it) */
function inventoryScan(code) {
  const hits = S.products.filter(p => Object.values(p.stores).some(i => sameCode(code, i.sku) || sameCode(code, i.code)));
  if (hits.length === 1) return openEdit(hits[0].key);
  if (hits.length > 1) {
    openModal(`<div class="mhead"><div><div class="mtitle">${hits.length} PRODUCTS USE ${esc(code)}</div><div class="msub">Pick the one you want</div></div><button class="x" data-close aria-label="Close">✕</button></div>
      <div class="mbody">${hits.map(p => `<button class="btn btn-ghost" style="text-align:left" data-pick-key="${esc(p.key)}">${esc(p.name)} <span class="note">· ${esc(p.category)}</span></button>`).join('')}</div>`);
    $('modal').querySelectorAll('[data-pick-key]').forEach(b => b.onclick = () => openEdit(b.dataset.pickKey));
    return;
  }
  confirmBox('Not in Clover yet', `<p>No product has barcode <b>${esc(code)}</b>${S.stores.length < 3 ? ' at your stores' : ''}.</p><p class="note" style="margin-top:6px">Create a new product with this barcode?</p>`, 'Create product', 'btn-green')
    .then(ok => { if (!ok) return; openNew(); $('nCode').value = code; $('nSku').value = code; $('nName').focus(); });
}

$('countView').addEventListener('click', async e => {
  const t = e.target;
  const start = t.closest('[data-start]'); if (start) return startCount(start.dataset.start);
  const tog = t.closest('[data-ctoggle]');
  if (tog) { const cat = tog.closest('.cat').dataset.cat; C.open.has(cat) ? C.open.delete(cat) : C.open.add(cat); return renderList(); }
  const step = t.closest('[data-step]');
  if (step) {
    const id = step.closest('.item').dataset.id;
    const cur = C.lines.get(id)?.counted ?? 0;
    return setCount(id, Math.max(0, cur + Number(step.dataset.step)));
  }
  const act = t.closest('[data-act]')?.dataset.act;
  if (act === 'back') { await flushCount().catch(() => {}); ls.del('cnt.id'); C.count = null; return countHome(false); }
  if (act === 'expand') {
    const cats = [...new Set(C.items.map(i => i.category))];
    const anyOpen = cats.some(c => C.open.has(c));
    C.open = anyOpen ? new Set() : new Set(cats); return renderList();
  }
  if (act === 'review') return openReview();
  if (act === 'camera') return openScanner({ title: `${C.count.storeName} count`, onCode: code => scanOrJump(code, true) });
  if (act === 'sheet') return renderSheet();
  if (act === 'submit') return submitCount();
  if (act === 'discard') return discardCount();
  if (act === 'done') return countHome(false);
});
$('countView').addEventListener('input', e => {
  const inp = e.target.closest('[data-qty]'); if (!inp) return;
  const raw = inp.value.trim();
  const id = inp.closest('.item').dataset.id;
  if (raw === '') { inp.classList.remove('bad'); return setCount(id, null); }
  const n = Number(raw);
  const ok = Number.isInteger(n) && n >= 0 && n <= 100000;
  inp.classList.toggle('bad', !ok);
  if (ok) setCount(id, n);
});
$('countView').addEventListener('keydown', e => {
  // Enter on a count jumps to the next item for fast keyboard counting
  const inp = e.target.closest('[data-qty]');
  if (inp && e.key === 'Enter') {
    e.preventDefault();
    const all = [...$('cList').querySelectorAll('[data-qty]')];
    const next = all[all.indexOf(inp) + 1];
    if (next) { next.focus(); next.select(); }
    else if (C.fromScan) { inp.blur(); openScanner({ title: `${C.count.storeName} count`, onCode: code => scanOrJump(code, true) }); }
  }
});

  C.review = r;
  const admin = isAdmin();
  el.innerHTML = `<div class="ctool"><div class="crow">
      <button class="btn btn-ghost btn-sm" data-act="sheet">← Back to counting</button>

    <div class="stats">

async function submitCount() {
  const r = C.review;
  const ok = await confirmBox('Submit to Clover?',
    `<p>${r.changes.length ? `This updates <b>${num(r.changes.length)}</b> item quantities in Clover for <b>${esc(C.count.storeName)}</b>.` : `No quantities will change. The count for <b>${esc(C.count.storeName)}</b> will be recorded.`}</p>
     <p class="note" style="margin-top:8px">Uncounted items are left alone. This can’t be undone from the app.</p>`, 'Yes, submit', 'btn-green');
  if (!ok) return;
  const id = C.count.id, storeName = C.count.storeName;
  const el = $('countView');
  el.innerHTML = `<div class="center"><div class="ctitle">SUBMITTING ${esc(storeName.toUpperCase())}…</div><div class="bar"><div id="pbar" style="width:3%"></div></div><div class="note" id="ptxt">Starting…</div></div>`;
  try { await api(`/counts/${id}/submit`, { method: 'POST' }); }
  catch (e) { if (!(e instanceof SignedOut)) { toast('❌ ' + e.message, 6000); openReview(); } return; }
  ls.del('cnt.id'); ls.del(pendKey(id)); C.pending.clear(); C.count = null;
  let c;
  for (;;) {
    await new Promise(res => setTimeout(res, 1200));
    try { c = (await api(`/counts/${id}/status`)).count; } catch (e) { if (e instanceof SignedOut) return; continue; }
    if (c.progress && $('pbar')) {
      $('pbar').style.width = Math.max(3, Math.round(c.progress.done / Math.max(c.progress.total, 1) * 100)) + '%';
      $('ptxt').textContent = `${num(c.progress.done)} of ${num(c.progress.total)} items sent to Clover`;
    }
    if (c.status === 'submitted') break;
  }
  const s = c.summary || {};
  el.innerHTML = `<div class="center">
    <div style="font-size:44px">${s.failed ? '⚠️' : '✅'}</div>
    <div class="ctitle" style="margin:8px 0">${esc(storeName.toUpperCase())} COUNT ${s.failed ? 'SUBMITTED WITH PROBLEMS' : 'SUBMITTED'}</div>
    <p class="lead">${num(s.counted)} items counted · ${num(s.changed)} quantities updated in Clover${s.failed ? ` · <span class="neg">${num(s.failed)} couldn’t be updated — your manager can retry them from Reports</span>` : ''}</p>
    <button class="btn btn-primary" data-act="done">Done</button></div>`;
}
async function discardCount() {
  const ok = await confirmBox('Discard this count?', `<p>All numbers entered for <b>${esc(C.count.storeName)}</b> in this count will be thrown away. Clover is not changed.</p>`, 'Discard', 'btn-ghost');
  if (!ok) return;
  try {
    await api(`/counts/${C.count.id}/discard`, { method: 'POST' });
    ls.del(pendKey(C.count.id)); ls.del('cnt.id'); C.pending.clear(); C.count = null;
    toast('Count discarded'); countHome(false);
  } catch (e) { if (!(e instanceof SignedOut)) toast('❌ ' + e.message, 6000); }
}

function downloadCSV(name, rows) {
  const blob = new Blob(['﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

    if (!Object.keys(body).length) return closeModal();
    try {
      const r = await api(`/users/${u.id}`, { method: 'POST', body });
      if (u.id === ME.id) { ME = r.user; ls.set('inv.user', JSON.stringify(ME)); $('who').textContent = ME.name; }
      closeModal(); toast('✅ Saved'); usersHome();
    } catch (err) { if (!(err instanceof SignedOut)) setStatus(err.message, 'bad'); }
  };
});

/* ── Boot + navigation ── */
let ME = null;
const isAdmin = () => ME?.role === 'admin' || ME?.role === 'owner';
const isOwner = () => ME?.role === 'owner';
function startApp(user) {
  ME = user;
  $('loginView').hidden = true; $('hdrRight').hidden = false;
  $('tabs').hidden = !isAdmin();
  document.querySelector('#tabs [data-view=users]').hidden = !isOwner();
  $('who').textContent = user.name;
  showView(isAdmin() ? (ls.get('inv.view') || 'inventory') : 'count');
}
function showView(v) {
  if (!isAdmin()) v = 'count';
  if (v === 'users' && !isOwner()) v = 'inventory';
  if (!['inventory', 'count', 'reports', 'users'].includes(v)) v = 'inventory';
  ls.set('inv.view', v);
  const map = { inventory: 'appView', count: 'countView', reports: 'reportsView', users: 'usersView' };
  VIEWS.forEach(id => $(id).hidden = id !== map[v]);
  document.querySelectorAll('#tabs [data-view]').forEach(b => b.setAttribute('aria-current', b.dataset.view === v ? 'page' : 'false'));
  document.querySelectorAll('.inv-only').forEach(e => e.hidden = v !== 'inventory');
  if (v === 'inventory' && !S.loaded) { S.loaded = true; sync(false); }
  if (v === 'count') countHome();
  if (v === 'reports') reportsHome();
  if (v === 'users') usersHome();
  window.scrollTo(0, 0);
}
$('tabs').addEventListener('click', async e => {
  const b = e.target.closest('[data-view]'); if (!b) return;
  await flushCount().catch(() => {});
  showView(b.dataset.view);
});
async function boot() {
  if (!auth.token()) return showLogin();
  let me = readJSON('inv.user', null);
  try { me = (await api('/me')).user; ls.set('inv.user', JSON.stringify(me)); }
  catch (e) {
    if (e instanceof SignedOut) return;
    if (!me) return showLogin(e.message);           // offline but we know who they are → carry on
  }
  startApp(me);
}
/* ── Install as an app ── */
let deferredInstall = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function updateInstallBtn() { $('installBtn').hidden = isStandalone() || !(deferredInstall || isIOS); }
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; updateInstallBtn(); });
addEventListener('appinstalled', () => { deferredInstall = null; updateInstallBtn(); toast('✅ Installed. Open “NS Inventory” from your home screen.', 6000); });
$('installBtn').onclick = async () => {
  if (deferredInstall) {
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch {}
    deferredInstall = null; updateInstallBtn(); return;
  }
  openModal(`<div class="mhead"><div class="mtitle">INSTALL ON IPHONE / IPAD</div><button class="x" data-close aria-label="Close">✕</button></div>
    <div class="mbody">
      <ol style="padding-left:20px;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.4">
        <li>Open this page in <b>Safari</b>.</li>
        <li>Tap the <b>Share</b> button <span style="display:inline-block;border:1px solid var(--border2);border-radius:4px;padding:0 6px">⬆︎</span> at the bottom (or top) of the screen.</li>
        <li>Scroll down and tap <b>Add to Home Screen</b>.</li>
        <li>Tap <b>Add</b>. The <b>NS Inventory</b> icon appears on your home screen.</li>
      </ol>
      <p class="note">Open the app from that icon from now on. You’ll sign in once inside the app.</p>
    </div>
    <div class="mfoot"><button class="btn btn-primary" data-close>Got it</button></div>`);
};
updateInstallBtn();
if ('serviceWorker' in navigator && location.pathname.startsWith('/app')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

fetch(API + '/health').catch(() => {}); // start waking Render right away
boot();
</script>
</body>
